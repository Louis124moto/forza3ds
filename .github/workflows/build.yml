name: Build 3DS homebrew

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "source/**"
      - "include/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitPro toolchain
        run: |
          test -n "$DEVKITPRO"
          test -n "$DEVKITARM"
          export PATH="$DEVKITARM/bin:$PATH"
          command -v arm-none-eabi-gcc
          command -v make
          command -v picasso

      - name: Build and install Citro3D
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          git clone --depth 1 https://github.com/devkitPro/citro3d.git "$RUNNER_TEMP/citro3d"
          make -C "$RUNNER_TEMP/citro3d" -j2
          make -C "$RUNNER_TEMP/citro3d" install

      - name: Build 3DSX
        id: build
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          if ! make 2> make_err.txt; then
            echo "Build failed. Compiler/linker output:"
            cat make_err.txt
            # Stream the first error lines as job annotations.
            head -n 40 make_err.txt | while IFS= read -r line; do
              echo "::error ::$line"
            done
            exit 1
          fi

      - name: Upload homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: forza3ds-3dsx
          path: forza3ds.3dsx
          if-no-files-found: error
          retention-days: 14

      - name: Build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        run: test -f make_err.txt && head -n 20 make_err.txt || true

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile deterministic engine tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Itests -Iinclude/forza3ds \
            tests/test_engine.c \
            source/core/core.c source/physics/physics.c \
            source/world/track.c source/world/terrain.c \
            source/vehicle/vehicle.c \
            -lm -o "$RUNNER_TEMP/forza3ds-tests"
      - name: Run deterministic engine tests
        run: "$RUNNER_TEMP/forza3ds-tests"
