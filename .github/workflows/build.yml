name: Build 3DS homebrew

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "include/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "source/**"
      - "include/**"
      - "Makefile"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitPro toolchain
        run: |
          test -n "$DEVKITPRO"
          test -n "$DEVKITARM"
          export PATH="$DEVKITARM/bin:$PATH"
          command -v arm-none-eabi-gcc
          command -v make

      - name: Build and install Citro3D
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          git clone --depth 1 https://github.com/devkitPro/citro3d.git "$RUNNER_TEMP/citro3d"
          make -C "$RUNNER_TEMP/citro3d" -j2
          make -C "$RUNNER_TEMP/citro3d" install

      - name: Build 3DSX
        run: |
          export PATH="$DEVKITARM/bin:$PATH"
          make clean
          make -j2

      - name: Upload homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: forza3ds-3dsx
          path: forza3ds.3dsx
          if-no-files-found: error
          retention-days: 14
